<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- كۆك رەڭلىك جۇلالىق ئۈنۈمى (Glow Filter) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- ئارقا كۆرۈنۈش ئۈچۈن ئدرادىي (Gradient) تەڭشىكى -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#004080" />
    </linearGradient>
  </defs>

  <!-- ئارقا كۆرۈنۈش تەگلىكى (قاراڭغۇ ھالىتىگە ماسلىشىشچان ۋە جۇلالىق) -->
  <rect width="900" height="600" rx="20" fill="url(#skyGradient)" filter="url(#glow)" opacity="0.95" />

  <!-- ئاي ۋە يۇلتۇز (ئاق رەڭدە، نۇرلاندۇرۇلغان) -->
  <g transform="translate(450, 300)">
    <!-- يېرىم ئاي -->
    <path d="M -50 -120 A 130 130 0 1 0 100 50 A 110 110 0 1 1 -50 -120 Z" fill="#ffffff" filter="drop-shadow(0px 0px 12px rgba(255, 255, 255, 0.8))" />
    
    <!-- بەش بۇرجەكلىك يۇلتۇز -->
    <polygon points="60,-15 75,20 110,25 82,50 90,85 60,65 30,85 38,50 10,25 45,20" fill="#ffffff" transform="translate(10, -20) scale(0.9)" filter="drop-shadow(0px 0px 10px rgba(255, 255, 255, 0.9))" />
  </g>

  <!-- گىرۋەك قىرلىرىغا نەپىس رامكا -->
  <rect x="10" y="10" width="880" height="580" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="3" />
</svg>
