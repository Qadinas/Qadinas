<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <!-- نۇرلۇق جۇلالىق سۈزگۈچى (Neon Glow) -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ئارقا كۆرۈنۈش ئۈچۈن قاراڭغۇ تەگلىك گىرادىيېنتى -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#061329" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- بايرىقىنىڭ كۆك رەڭ گىرادىيېنتى -->
    <linearGradient id="flagBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0033aa" />
    </linearGradient>

    <!-- تېكىست ئۈچۈن نۇرلۇق كۆك گىرادىيېنت -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- بايرىقىغا لەپىلدەش (Wave) ئۈنۈمى -->
    <filter id="wavingWave">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.04" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" values="0.012 0.035;0.018 0.055;0.012 0.035" dur="4s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- ئارقا كۆرۈنۈش رامكىسى -->
  <rect width="1000" height="450" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- تور سىزىقلىرى (Grid Pattern) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0 75 L 1000 75 M 0 150 L 1000 150 M 0 225 L 1000 225 M 0 300 L 1000 300 M 0 375 L 1000 375" />
    <path d="M 166 0 L 166 450 M 332 0 L 332 450 M 498 0 L 498 450 M 664 0 L 664 450 M 830 0 L 830 450" />
  </g>

  <!-- === سول تەرەپ: Qadinas تېكىستى ۋە ئۇچۇرلار === -->
  <g transform="translate(60, 65)">
    <!-- يۇقىرىدىكى بەلگە (Badge) -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1" />
      <circle cx="15" cy="15" r="5" fill="#00f2fe" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">AVAILABLE FOR COLLABORATION</text>
    </g>

    <!-- Hello World تېكىستى -->
    <text x="0" y="90" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="2">▶ HELLO WORLD, IT IS</text>

    <!-- Qadinas تېكىستى -->
    <text x="0" y="160" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="3" filter="url(#neonGlow)">QADINAS</text>

    <!-- چۈشەندۈرۈش تېكىستلىرى -->
    <text x="0" y="210" fill="#64748b" font-family="sans-serif" font-size="14">Building open, decentralized, and elegant software</text>
    <text x="0" y="235" fill="#64748b" font-family="sans-serif" font-size="14">experiences. Empowering innovation through clean code</text>
    <text x="0" y="260" fill="#64748b" font-family="sans-serif" font-size="14">and modern technology.</text>
  </g>

  <!-- === ئوڭ تەرەپ: شەرقىي تۈركىستاننىڭ لەپىلدەيدىغان كۆك بايرىقى === -->
  <g transform="translate(750, 225)">
    <g filter="url(#wavingWave)">
      <rect x="-140" y="-95" width="280" height="190" rx="12" fill="url(#flagBlue)" stroke="#00d2ff" stroke-width="2" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
      </rect>

      <!-- ئاي ۋە يۇلتۇز -->
      <g transform="translate(0, 0)">
        <path d="M -30 -55 A 65 65 0 1 0 50 20 A 55 55 0 1 1 -30 -55 Z" fill="#ffffff" filter="url(#neonGlow)" />
        <polygon points="35,-5 45,18 70,22 50,40 56,65 35,52 14,65 20,40 0,22 25,18" fill="#ffffff" transform="translate(10, -5) scale(0.85)" filter="url(#neonGlow)" />
      </g>
    </g>
  </g>

  <!-- نۇر سىزىقى (Shine Effect) -->
  <path d="M -150 0 L 150 450" stroke="rgba(255, 255, 255, 0.15)" stroke-width="40" filter="url(#neonGlow)">
    <animate attributeName="transform" type="translate" values="-200,0; 1200,0" dur="4s" repeatCount="indefinite" />
  </path>
</svg>
